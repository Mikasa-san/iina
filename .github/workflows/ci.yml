name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choose build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Nightly

jobs:
  build:
    strategy:
      matrix:
        include:
          - xcode: "27"
            deployment_target: ""
    runs-on:  xcode-27

    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'Release' }}
      
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: ./other/download_libs.sh $DOWNLOAD_LIBS_ARGS
        env:
          DOWNLOAD_LIBS_ARGS: ${{ github.event_name == 'pull_request' && '--skip-plugins' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          xcodebuild \
            -project iina.xcodeproj \
            -scheme iina \
            -configuration "$BUILD_TYPE" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ${{ matrix.deployment_target }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

      - name: Create DMG
        run: hdiutil create -volname "IINA $BUILD_TYPE" -srcfolder Build/Products/$BUILD_TYPE/IINA.app -ov -format UDZO IINA.dmg

      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: IINA
          path: IINA.dmg
          archive: false
