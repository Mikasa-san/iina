name: CI

on:
  push:
      branches: [develop]
  pull_request:
      branches: [develop]

jobs:
  build:
    strategy:
      matrix:
        include:
          - xcode: "26.0"
            deployment_target: ""
    runs-on:  macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: ./other/download_libs.sh

      - name: Build
        run: xcodebuild -project iina.xcodeproj -scheme iina -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=NO ${{ matrix.deployment_target }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

      - name: Create DMG
        run: |
          APP_PATH="/Users/runner/Library/Developer/Xcode/DerivedData/iina-csbkugdtxazzqogjnydbothqrvib/Build/Products/Release/IINA.app"
          mkdir dmg
          cp -R "$APP_PATH" dmg/

          hdiutil create \
            -volname "IINA" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            IINA.dmg
            
      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v6
        with:
          name: IINA-dmg
          path: IINA.dmg

